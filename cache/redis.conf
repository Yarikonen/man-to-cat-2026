# Redis configuration for man-to-cat data pipeline
# Focus on deduplication and cache management

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory management
# Set maxmemory-policy to allkeys-lru for deduplication cache
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (disabled for cache use, rely on Postgres for state)
save ""
appendonly no

# Logging
loglevel warning

# Clients
maxclients 10000

# Security (rely on network isolation in Docker)
# protected-mode is disabled when binding to 0.0.0.0 with Docker networking

# Performance
databases 1
hz 10
dynamic-hz yes

# Advanced
tcp-nodelay yes
hz 10
activerehashing yes
