# Шаблон конфига Alertmanager. Плейсхолдеры __BOT_TOKEN__ и __CHAT_ID__
# подставляются из переменных окружения при старте контейнера (см. entrypoint
# alertmanager в docker-compose.yml). Реальные значения берутся из .env:
#   TELEGRAM_BOT_TOKEN        — тот же токен, что у бота
#   TELEGRAM_ALERT_CHAT_ID    — куда слать алерты (int; для групп отрицательный)
#
# Как узнать chat_id: напишите боту/добавьте его в группу, затем откройте
#   https://api.telegram.org/bot<ТОКЕН>/getUpdates  и возьмите "chat":{"id":...}.

global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: telegram
      repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "__BOT_TOKEN__"
        chat_id: __CHAT_ID__
        api_url: "https://api.telegram.org"
        parse_mode: "HTML"
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} <b>{{ .CommonLabels.alertname }}</b> [{{ .Status | toUpper }}]
          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b>
          {{ .Annotations.description }}
          уровень: {{ .Labels.level }} | severity: {{ .Labels.severity }} | runbook: {{ .Annotations.runbook }}
          {{ end }}
