global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules across the 3 monitoring levels (data / model / system).
# Rules are evaluated by Prometheus and visible at http://localhost:9090/alerts.
rule_files:
  - /etc/prometheus/alerts.yml

# Route firing alerts to Alertmanager, which forwards them to Telegram.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "bot"
    static_configs:
      - targets: ["bot:8000"]
    metrics_path: /metrics

  - job_name: "model_service"
    static_configs:
      - targets: ["model_service:8002"]
    metrics_path: /metrics

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "minio"
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster

  # GPU metrics — target is down until the `gpu` compose profile is enabled.
  - job_name: "gpu"
    static_configs:
      - targets: ["gpu-exporter:9835"]
