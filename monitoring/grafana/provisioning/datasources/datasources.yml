apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    # uid must match the datasource uid hard-coded in dashboards/*.json,
    # otherwise provisioned dashboards reference a non-existent datasource
    # and render empty panels ("Datasource not found").
    uid: PBFA97CFB590B2093
    isDefault: true
    editable: false
