global:
  scrape_interval: 30s
  evaluation_interval: 30s

  # Resource limits to prevent unbounded cardinality
  external_labels:
    environment: 'development'
    cluster: 'man2cat-infra'

# Scrape configurations for infrastructure services
scrape_configs:
  - job_name: 'ingestion-upload'
    static_configs:
      - targets: ['ingestion-upload:8000']
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'airflow'
    static_configs:
      - targets: ['airflow:9100']
    metrics_path: /metrics
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scrape_interval: 30s

  # RabbitMQ metrics via exporter
  - job_name: 'prometheus-rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
    metrics_path: /metrics
    scrape_interval: 30s
    # Labels for infrastructure identification
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'rabbitmq:5672'

  # PostgreSQL metrics via exporter
  - job_name: 'prometheus-postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: /metrics
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres:5432'

  # Redis metrics via exporter
  - job_name: 'prometheus-redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: /metrics
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis:6379'

  # MinIO metrics
  - job_name: 'prometheus-minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/cluster
    scrape_interval: 30s
    scheme: http
    params:
      format: ['prometheus']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'minio:9000'

  # Application services (to be added as services are deployed)
  - job_name: 'application-services'
    static_configs:
      - targets:
          - 'segmentation:9100'
          - 'preprocessing:9100'
    metrics_path: /metrics
    scrape_interval: 30s
    # Allow service discovery
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
        replacement: '$1'

