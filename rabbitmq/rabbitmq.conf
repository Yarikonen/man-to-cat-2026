# RabbitMQ Configuration for man-to-cat pipeline
# DLQ topology configuration

# Enable management plugin
management.tcp.port = 15672

# Default user credentials (overridden by environment variables)
# default_user = app
# default_pass = secure_password
# default_vhost = /

# Logging
log.console = true
log.console.level = info

# Memory and disk thresholds
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Queue settings for DLQ
default_vhost = /
default_user = app
default_pass = secure_password

# Connection limits
num_acceptors.tcp = 10
handshake_timeout = 10000
heartbeat = 60

# Channel limits
channel_max = 65535

# Message size limit (images stored in S3, messages contain only paths)
max_message_size = 134217728  # 128MB (well above what we need for path-only messages)

# Queue master locator
queue_master_locator = min-masters

# Dead Letter Exchange settings (configured via queue arguments in code)
# loopback_users.guest = false

# Collect statistics
collect_statistics_interval = 5000

# TCP buffer sizes for better throughput
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.linger.on = true
tcp_listen_options.linger.timeout = 0

# Background GC
gc_minor_threshold = 16777216
gc_major_threshold = 67108864
