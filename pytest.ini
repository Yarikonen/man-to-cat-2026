[pytest]
# Minimum required version
minversion = 8.3.4

# Verbose output with markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add test options for better output
addopts =
    -v
    --strict-markers
    --tb=short
    --strict-config
    --disable-warnings
    -p no:cacheprovider
    -p no:stepwise

# Async testing support
asyncio_mode = auto

# Docker compose testing
# Requires: pytest-docker plugin
docker_compose_project_name = man2cat-tests

# Test duration reporting
durations = 10

# Markers for different test categories
markers =
    integration: Integration tests that require Docker containers
    unit: Unit tests without external dependencies
    infra: Infrastructure component tests
    observability: Metrics and logging tests
    slow: Tests that take longer than 10 seconds
    gpu: Tests requiring GPU (skipped in CPU-only environments)
    xfail: Expected failures (not yet implemented)

# Coverage configuration
[coverage:run]
source =
    services/
    orchestration/

omit =
    */tests/*
    */__pycache__/*
    */test_*.py

[coverage:report]
precision = 1
show_missing = True
skip_covered = False

[coverage:html]
directory = coverage_html

# Logging during tests
[pytest:log_cli]
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %H:%M:%S

# Parallel execution
[pytest:xdist]
# Uncomment to enable parallel test execution
# -n auto
